site_name: "matchlab"
site_description: "Documentation for matchlab"
repo_url: "https://github.com/uktrade/matchlab"
repo_name: "uktrade/matchlab"

nav:
- Home:
  - Welcome: index.md
  - Why matchlab: why-matchlab.md
  - Use cases: use-cases.md
  - Glossary: glossary.md
- Guide:
  - Install: guide/install.md
  - Build a plan: guide/build-a-plan.md
  - Query the result: guide/query.md
  - Evaluate: guide/evaluate.md
- Migration:
  - Matchbox to matchlab: migration/matchbox-to-matchlab.md
- API reference:
  - Plan:
    - Steps: api/steps.md
    - Specs: api/specs.md
    - Lineage: api/lineage.md
    - Progress: api/progress.md
    - Sources: api/sources.md
    - Views: api/views.md
    - Models: api/models.md
    - Resolvers: api/resolvers.md
  - Storage:
    - Adapters: api/adapters.md
    - Locations: api/locations.md
  - Evaluation:
    - Sampling: api/eval-sampling.md
    - Judgements: api/eval-judgements.md
    - Metrics: api/eval-metrics.md
    - Interactive review: api/eval-tui.md
  - Core:
    - Schemas: api/core/schemas.md
    - Resolver output: api/core/resolver_output.md
    - Exceptions: api/core/exceptions.md
    - Hashing: api/core/hash.md
    - Transform: api/core/transform.md
    - Testkit: api/testkit.md
- Contributing:
  - Guidelines: contributing.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - smarty
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          inventories:
          - https://docs.python.org/3/objects.inv
          - https://typing-extensions.readthedocs.io/en/latest/objects.inv
          paths: [src]
          options:
            extensions:
              - griffe_inherited_docstrings
            docstring_options:
              ignore_init_summary: true
            preload_modules: [matchlab]
            docstring_style: google
            docstring_section_style: list
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_bases: true
            show_inheritance_diagram: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            extra:
              show_docstring_inheritance: true
              show_inheritance: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uktrade/matchlab
  generator: false

extra_css:
  - stylesheets/extra.css
