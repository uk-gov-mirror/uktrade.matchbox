[project]
site_name = "matchlab documentation"
site_description = "Documentation for matchlab"

repo_url = "https://github.com/uktrade/matchlab"
repo_name = "uktrade/matchlab"

nav = [
  { "Home" = [
    { "Welcome" = "index.md" },
    { "Why matchlab" = "why-matchlab.md" },
    { "Use cases" = "use-cases.md" },
    { "Glossary" = "glossary.md" },
  ] },

  { "Guide" = [
    { "Install" = "guide/install.md" },
    { "Build a plan" = "guide/build-a-plan.md" },
    { "Query the result" = "guide/query.md" },
    { "Evaluate" = "guide/evaluate.md" },
    { "Serialise a plan" = "guide/serialise.md" },
    { "Custom methodologies" = "guide/custom-methodologies.md" },
    { "Migration" = "guide/matchbox-to-matchlab.md" },
  ] },

  { "API reference" = [
    { "Plan" = [
      { "Steps" = [
        { "Steps" = "api/plan/steps/index.md" },
        { "Transformers" = [
          { "Transformers" = "api/plan/steps/transformers/index.md" },
          { "Clean" = "api/plan/steps/transformers/clean.md" },
          { "Select" = "api/plan/steps/transformers/select.md" },
          { "Group" = "api/plan/steps/transformers/group.md" },
          { "Explode" = "api/plan/steps/transformers/explode.md" },
        ] },
        { "Sources" = [
          { "Sources" = "api/plan/steps/sources/index.md" },
          { "Dataframe" = "api/plan/steps/sources/dataframe.md" },
          { "Relational database" = "api/plan/steps/sources/relational.md" },
        ] },
        { "Models" = [
          { "Models" = "api/plan/steps/models/index.md" },
          { "Dedupers" = [
            { "Dedupers" = "api/plan/steps/models/dedupers/index.md" },
            { "Naive" = "api/plan/steps/models/dedupers/naive.md" },
          ] },
          { "Linkers" = [
            { "Linkers" = "api/plan/steps/models/linkers/index.md" },
            { "Deterministic" = "api/plan/steps/models/linkers/deterministic.md" },
            { "Weighted deterministic" = "api/plan/steps/models/linkers/weighted-deterministic.md" },
            { "Splink" = "api/plan/steps/models/linkers/splink.md" },
          ] },
        ] },
        { "Resolvers" = [
          { "Resolvers" = "api/plan/steps/resolvers/index.md" },
          { "Components" = "api/plan/steps/resolvers/components.md" },
        ] },
      ] },
      { "Specs" = "api/plan/specs.md" },
      { "Resources" = "api/plan/resources.md" },
      { "Documents" = "api/plan/document.md" },
      { "Lineage" = "api/plan/lineage.md" },
      { "Progress" = "api/plan/progress.md" },
      { "Record step" = "api/plan/steps/recordstep.md" },
    ] },

    { "Stores" = [
      { "Stores" = "api/stores/index.md" },
      { "DuckDB" = "api/stores/duckdb.md" },
    ] },

    { "Evaluation" = [
      { "Sampling" = "api/evaluation/sampling.md" },
      { "Judgements" = "api/evaluation/judgements.md" },
      { "Metrics" = "api/evaluation/metrics.md" },
      { "Interactive review" = "api/evaluation/tui.md" },
    ] },

    { "Core" = [
      { "Schemas" = "api/core/schemas.md" },
      { "Resolver output" = "api/core/resolver_output.md" },
      { "Exceptions" = "api/core/exceptions.md" },
      { "Hashing" = "api/core/hash.md" },
      { "Transform" = "api/core/transform.md" },
      { "Testkit" = "api/core/testkit.md" },
    ] },
  ] },

  { "Contributing" = "contributing.md" },
]

[project.theme]
variant = "modern"
logo = "assets/matchlab-icon-light.svg"
favicon = "assets/matchlab-icon-light.svg"
features = [
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://typing-extensions.readthedocs.io/en/latest/objects.inv",
]
paths = [
  "src",
]
options.extensions = [
  "griffe_inherited_docstrings",
]
options.preload_modules = [
  "matchlab",
]
options.docstring_style = "google"
options.docstring_section_style = "list"
options.heading_level = 2
options.ignore_init_summary = true
options.inherited_members = true
options.merge_init_into_class = true
options.parameter_headings = true
options.separate_signature = true
options.show_bases = true
options.show_inheritance_diagram = true
options.show_root_full_path = false
options.show_source = false
options.show_signature_annotations = true
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.signature_crossrefs = true
options.summary = true
