[project]
site_name = "matchlab documentation"
site_description = "Documentation for matchlab"

repo_url = "https://github.com/uktrade/matchlab"
repo_name = "uktrade/matchlab"

nav = [
  { "Home" = [
    { "Welcome" = "index.md" },
    { "Why matchlab" = "why-matchlab.md" },
    { "Use cases" = "use-cases.md" },
    { "Glossary" = "glossary.md" },
  ] },

  { "Guide" = [
    { "Install" = "guide/install.md" },
    { "Build a plan" = "guide/build-a-plan.md" },
    { "Query the result" = "guide/query.md" },
    { "Evaluate" = "guide/evaluate.md" },
    { "Serialise a plan" = "guide/serialise.md" },
    { "Custom methodologies" = "guide/custom-methodologies.md" },
  ] },

  { "Migration" = [
    { "Matchbox to matchlab" = "migration/matchbox-to-matchlab.md" },
  ] },

  { "API reference" = [
    { "Plan" = [
      { "Steps" = "api/steps.md" },
      { "Specs" = "api/specs.md" },
      { "Documents" = "api/document.md" },
      { "Lineage" = "api/lineage.md" },
      { "Progress" = "api/progress.md" },
      { "Sources" = "api/sources.md" },
      { "Locations" = "api/locations.md" },
      { "Record step" = "api/recordstep.md" },
      { "Transformers" = "api/transformers.md" },
      { "Models" = "api/models.md" },
      { "Resolvers" = "api/resolvers.md" },
    ] },

    { "Storage" = [
      { "Adapters" = "api/adapters.md" },
      { "Resources" = "api/resources.md" },
    ] },

    { "Evaluation" = [
      { "Sampling" = "api/eval-sampling.md" },
      { "Judgements" = "api/eval-judgements.md" },
      { "Metrics" = "api/eval-metrics.md" },
      { "Interactive review" = "api/eval-tui.md" },
    ] },

    { "Core" = [
      { "Schemas" = "api/core/schemas.md" },
      { "Resolver output" = "api/core/resolver_output.md" },
      { "Exceptions" = "api/core/exceptions.md" },
      { "Hashing" = "api/core/hash.md" },
      { "Transform" = "api/core/transform.md" },
      { "Testkit" = "api/testkit.md" },
    ] },
  ] },

  { "Contributing" = [
    { "Guidelines" = "contributing.md" },
  ] },
]

[project.theme]
variant = "modern"
logo = "assets/matchlab-icon-light.svg"
favicon = "assets/matchlab-icon.svg"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true

[project.markdown_extensions.pymdownx]
arithmatex.generic = true
betterem = {}
blocks.caption = {}
caret = {}
details = {}
emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
emoji.emoji_index = "zensical.extensions.emoji.twemoji"
highlight.anchor_linenums = true
highlight.line_spans = "__span"
highlight.pygments_lang_class = true
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
snippets = {}
superfences.custom_fences = [
  {
    name = "mermaid",
    class = "mermaid",
    format = "pymdownx.superfences.fence_code_format",
  },
]
tabbed.alternate_style = true
tabbed.combine_header_slug = true
tasklist.custom_checkbox = true
tilde = {}

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://typing-extensions.readthedocs.io/en/latest/objects.inv",
]
paths = [
  "src",
]
options.extensions = [
  "griffe_inherited_docstrings",
]
options.preload_modules = [
  "matchlab",
]
options.docstring_style = "google"
options.docstring_section_style = "list"
options.heading_level = 2
options.ignore_init_summary = true
options.inherited_members = true
options.merge_init_into_class = true
options.parameter_headings = true
options.separate_signature = true
options.show_bases = true
options.show_inheritance_diagram = true
options.show_root_full_path = false
options.show_source = false
options.show_signature_annotations = true
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
options.signature_crossrefs = true
options.summary = true
options.extra.show_docstring_inheritance = true
options.extra.show_inheritance = true
