# matchlab is a local-first library: the only container it needs is a warehouse to
# read source data from. The API, Postgres backend, Redis, Celery worker, Flower and
# object storage all went with the server.
services:
  warehouse:
    image: postgres:17
    restart: always
    ports:
      - "7654:5432"
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5
